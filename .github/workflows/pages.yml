name: Deploy website to GitHub Pages

on:
  push:
    branches:
      - main
      - master
    paths:
      - web/**
      - demo/**
      - crates/picard/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5
        id: pages

      - name: Install mdBook
        run: |
          curl -sSL https://github.com/rust-lang/mdBook/releases/download/v0.4.40/mdbook-v0.4.40-x86_64-unknown-linux-gnu.tar.gz | tar -xz
          sudo mv mdbook /usr/local/bin/

      - name: Build documentation (mdBook)
        working-directory: web
        env:
          MDBOOK_OUTPUT__HTML__SITE_URL: ${{ steps.pages.outputs.base_path }}/docs/
        run: mdbook build --dest-dir ../_site/docs

      # Gatsby 2 requires an old Node version
      - uses: actions/setup-node@v4
        with:
          node-version: 14

      - name: Build front page (Gatsby)
        working-directory: web/frontpage
        env:
          PATH_PREFIX: ${{ steps.pages.outputs.base_path }}
        run: |
          npm install
          npm run build -- --prefix-paths

      - name: Merge front page and documentation
        run: cp -r web/frontpage/public/. _site/

      - name: Install Rust with the wasm target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        run: curl -sSf https://rustwasm.github.io/wasm-pack/installer/init.sh | sh

      - name: Build Living City demo (WebAssembly)
        run: |
          wasm-pack build demo --release --target web --out-dir web/pkg --no-default-features
          mkdir -p _site/demo/pkg
          cp demo/web/index.html _site/demo/
          cp demo/web/worker.js _site/demo/
          cp demo/web/pkg/living_city.js demo/web/pkg/living_city_bg.wasm _site/demo/pkg/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
