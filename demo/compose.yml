services:
  district-0:
    cpus: 0.1
    build:
      context: ..
      dockerfile: demo/Dockerfile
    command: [ "--district", "0", "--web-ui", "--host", "0.0.0.0", "--connect", "1=ws://district-1:9100/remoting", "--connect", "2=ws://district-2:9100/remoting", "--connect", "3=ws://district-3:9100/remoting", "--connect", "4=ws://district-4:9100/remoting", "--connect", "5=ws://district-5:9100/remoting", "--connect", "6=ws://district-6:9100/remoting", "--connect", "7=ws://district-7:9100/remoting", "--connect", "8=ws://district-8:9100/remoting" ]
    environment:
      LIVING_CITY_REMOTE_TOKEN: ${LIVING_CITY_REMOTE_TOKEN:?Set a strong LIVING_CITY_REMOTE_TOKEN}
      PICARD_CONSOLE_LISTEN: 127.0.0.1:9000
      PICARD_CONSOLE_TOKEN: ${LIVING_CITY_CONSOLE_TOKEN:?Set a strong LIVING_CITY_CONSOLE_TOKEN}
    ports:
      - "${LIVING_CITY_PORT:-8981}:8981"
    expose: [ "9100" ]
    depends_on:
      - district-1
      - district-2
      - district-3
      - district-4
      - district-5
      - district-6
      - district-7
      - district-8
    restart: unless-stopped

