[package]
name = "picard-macros"
version = "0.2.0"
description = "Macro crate for Picard actor framework"
readme = "README.md"
keywords = ["actors", "actor-model", "async", "cqrs", "event_sourcing"]
authors.workspace = true
edition.workspace = true
repository.workspace = true
license-file.workspace = true

[lib]
proc-macro = true

[lints]
workspace = true

[dependencies]
syn = { version = "2", features = ["parsing", "full", "extra-traits", "proc-macro"] }
quote = "1.0"
proc-macro2 = "1.0"

[dev-dependencies]
picard.workspace = true
serde.workspace = true
