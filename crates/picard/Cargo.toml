[package]
name = "picard"
version = "0.4.2"
description = "Easily build fast, highly concurrent and resilient applications. An Actor Framework for Rust."
readme = "README.md"
keywords = ["actors", "actor-model", "async", "cqrs", "event_sourcing"]
authors.workspace = true
edition.workspace = true
repository.workspace = true
license-file.workspace = true

[lints]
workspace = true

[dependencies]
picard-macros.workspace = true
config.workspace = true
chrono = "0.4"
futures = { version = "0.3.4", features = ["thread-pool"] }
crossbeam-channel = "0.5"
rand = "0.9"
uuid = { version = "1", features = ["v4", "serde"] }
slog = "2.5"
slog-stdlog = "4.0"
slog-scope = "4.3.0"
dashmap = "6"
thiserror = "2.0.21"
serde.workspace = true
better_default = "1.0.5"
tracing = { version = "0.1", optional = true }
serde_json = { version = "1", optional = true }
subtle = { version = "2.6", optional = true }

[features]
default = []
## Emit `tracing` spans and events for actor lifecycle, supervision and message handling.
tracing = ["dep:tracing"]
## Count actor creations, terminations, restarts and message sends; read them with `ActorSystem::stats()`.
stats = []
## Require every actor message to implement `serde::Serialize` and `serde::de::DeserializeOwned`,
## and derive both for the message enums generated by `#[actor]`.
serde = []
## Expose an explicitly started, authenticated WebSocket runtime console on native targets.
console = ["dep:serde_json", "dep:tungstenite"]
## Enable native WebSocket remoting with JSON frames and authenticated peers.
remoting = ["serde", "dep:serde_json", "dep:subtle", "dep:tungstenite"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tungstenite = { version = "0.29", optional = true, features = ["rustls-tls-webpki-roots"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
web-time = "1"
gloo-timers = { version = "0.3", features = ["futures"] }
getrandom = { version = "0.3", features = ["wasm_js"] }
uuid = { version = "1", features = ["js"] }

[dev-dependencies]
picard-testkit.workspace = true
log.workspace = true
criterion = "0.5"
serde_json = "1"

[[bench]]
name = "runtime"
harness = false

[[bench]]
name = "actor_suite"
harness = false
