[package]
name = "picard"
version = "0.4.2"
description = "Easily build fast, highly concurrent and resilient applications. An Actor Framework for Rust."
readme = "README.md"
keywords = ["actors", "actor-model", "async", "cqrs", "event_sourcing"]
authors.workspace = true
edition.workspace = true
repository.workspace = true
license-file.workspace = true

[lints]
workspace = true

[dependencies]
picard-macros.workspace = true
config.workspace = true
chrono = "0.4"
futures = { version = "0.3.4", features = ["thread-pool"] }
crossbeam-channel = "0.5"
rand = "0.9"
uuid = { version = "1", features = ["v4"] }
slog = "2.5"
slog-stdlog = "4.0"
slog-scope = "4.3.0"
dashmap = "6"
thiserror = "2.0.21"
serde = { version = "1.0.229", features = ["derive"] }
better_default = "1.0.5"
tracing = { version = "0.1", optional = true }

[features]
default = []
## Emit `tracing` spans and events for actor lifecycle, supervision and message handling.
tracing = ["dep:tracing"]
## Count actor creations, terminations, restarts and message sends; read them with `ActorSystem::stats()`.
stats = []

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
web-time = "1"
gloo-timers = { version = "0.3", features = ["futures"] }
getrandom = { version = "0.3", features = ["wasm_js"] }
uuid = { version = "1", features = ["js"] }

[dev-dependencies]
picard-testkit.workspace = true
log.workspace = true
criterion = "0.5"

[[bench]]
name = "runtime"
harness = false

[[bench]]
name = "actor_suite"
harness = false
